name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Keccak256.sln

      - name: Build
        run: dotnet build Keccak256.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project Epoche.Keccak256.Tests/Epoche.Keccak256.Tests.csproj --configuration Release --no-build
